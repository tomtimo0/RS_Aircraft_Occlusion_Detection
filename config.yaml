# config.yaml

# ----------------------------------------------------------------------
# 应用基本信息
# ----------------------------------------------------------------------
page_title: "遥感图像目标检测与遮挡模拟"
app_title: "🛰️ 遥感图像目标检测与高斯光斑模拟"
app_description: |
  欢迎使用本应用！您可以上传遥感图像，在其上模拟添加高斯光斑遮挡，
  并使用本地YOLO OBB模型进行目标检测（如飞机）。
app_footer: "遥感图像飞机目标检测与遮挡模拟APP v1.2 (配置文件加载)"

# ----------------------------------------------------------------------
# 应用设置
# ----------------------------------------------------------------------
app_settings:
  allowed_image_types: ["png", "jpg", "jpeg", "bmp", "tif"]

# ----------------------------------------------------------------------
# 模型配置
# ----------------------------------------------------------------------
# 定义可用的YOLO OBB模型。
# 'name' 将显示在UI的下拉列表中。
# 'path' 是相对于项目根目录的模型文件路径。
# 确保这些 .pt 文件实际存在于你的 models_yolo/ 目录下。
# ----------------------------------------------------------------------
models:
  - name: "基线模型"
    path: "models_yolo/yolov8n-obb.pt"
  - name: "我的圆形光斑模型"
    path: "models_yolo/my_circle_spot_model.pt"
  - name: "我的椭圆光斑模型"
    path: "models_yolo/my_ellipse_spot_model.pt"
  # 你可以根据需要添加更多模型

# ----------------------------------------------------------------------
# 检测参数 (例如，飞机类别ID)
# ----------------------------------------------------------------------
detection_params:
  target_plane_class_id: 0 # DOTA数据集中飞机通常是类别0

# ----------------------------------------------------------------------
# 指标计算参数
# ----------------------------------------------------------------------
metrics_params:
  k_sigma_for_ooap: 2.0 # 用于定义OOAP计算时光斑边界的sigma倍数

# ----------------------------------------------------------------------
# 可视化参数
# ----------------------------------------------------------------------
visualization:
  ground_truth_color_bgr: [0, 0, 255] # BGR for Red
  # detection_color_bgr: [0, 255, 0] # BGR for Green (可由visualization.py内部处理)

# ----------------------------------------------------------------------
# 默认UI参数配置 (可选)
# ----------------------------------------------------------------------
# 这些值可以用来设置Streamlit小部件的初始默认值。
# ----------------------------------------------------------------------
default_ui_params:
  # 光斑参数
  spot_shape: "ellipse"  # 'ellipse' or 'circle'
  spot_sigma_x: 50
  spot_sigma_y: 30
  spot_sigma_circle: 40
  spot_rotation_angle_deg: 0
  spot_amplitude: 1.5
  enable_spot_default: False # 是否默认启用光斑

  # 检测参数
  confidence_threshold: 0.25
  iou_threshold: 0.45

visualization:
  ground_truth_color_bgr: [0, 0, 255] # Red for GT
  max_comparison_cols: 2 # 最多并排显示几列模型结果
  model_colors: # 为不同模型的检测框指定颜色 (BGR)
    - [0, 255, 0]   # Green for first selected model's detections
    - [255, 0, 0]   # Blue for second
    - [0, 255, 255] # Yellow for third
    - [255, 0, 255] # Magenta for fourth
    # 如果选择的模型超过这里的颜色数量，draw_all_detections 中的随机颜色会生效

# ----------------------------------------------------------------------
# 其他应用配置 (未来可扩展)
# ----------------------------------------------------------------------
